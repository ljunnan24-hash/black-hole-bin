name: Bug report
description: Report a reproducible Black Hole Bin problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use a disposable file when reproducing drag/drop problems.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows x64
        - Windows ARM64
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and device
      placeholder: Windows 11 24H2, Surface Laptop 7 / macOS 15.5, MacBook Air M3
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Drag source
      description: Finder, File Explorer, Desktop, cloud drive, network volume, another app, etc.
    validations:
      required: true
  - type: dropdown
    id: hover
    attributes:
      label: Did the hover animation appear?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: suction
    attributes:
      label: Did the suction animation start after release?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch the app
        2. Drag ...
        3. Release ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private paths or filenames before posting.
      render: shell
